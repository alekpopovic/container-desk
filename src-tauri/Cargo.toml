[package]
name = "containerdesk"
version = "0.1.0"
description = "Native desktop Docker manager over OpenSSH"
edition = "2024"
rust-version = "1.98.1"
publish = false

[lib]
name = "containerdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.7.0"

[dependencies]
tauri = "=2.12.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
