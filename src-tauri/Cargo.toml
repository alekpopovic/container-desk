[package]
name = "containerdesk"
version = "0.1.0"
description = "Native desktop Docker manager over OpenSSH"
edition = "2024"
rust-version = "1.98.1"
publish = false

[lib]
name = "containerdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "net"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

libc = "=0.2.189"
getrandom = "=0.4.3"
tauri-plugin-dialog = "=2.8.0"
portable-pty = "=0.9.0"

[dev-dependencies]
ts-rs = "=12.0.1"
tauri = { version = "=2.12.0", features = ["test"] }
