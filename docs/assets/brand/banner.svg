<text x="165" y="109" fill="#e7eef2" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="700">Container<tspan fill="#6cdec6">Desk</tspan></text>
<text x="64" y="196" fill="#e7eef2" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="700">Your servers. Your SSH. One workspace.</text>
<text x="66" y="244" fill="#abbcc9" font-family="DejaVu Sans, sans-serif" font-size="22">A native desktop for Docker on Linux servers.</text>
<text x="66" y="307" fill="#6cdec6" font-family="DejaVu Sans, sans-serif" font-size="17" letter-spacing="2">LINUX + macOS     /     OPENSSH     /     LOCAL FIRST</text>
