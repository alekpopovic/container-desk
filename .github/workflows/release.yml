name: Manual release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 0.1.1 or v0.1.1)'
        required: true
        type: string
      prerelease:
        description: Mark as a pre-release (packages are currently unsigned)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: containerdesk-public-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.repository == 'alekpopovic/container-desk'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      version: ${{ steps.prepare.outputs.version }}
      previous_tag: ${{ steps.prepare.outputs.previous_tag }}
      previous_sha: ${{ steps.prepare.outputs.previous_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and commit aligned application versions
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh auth setup-git
          python3 scripts/release.py prepare

  checks:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}

  publish:
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify all native artifacts and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          RELEASE_PREVIOUS_SHA: ${{ needs.prepare.outputs.previous_sha }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: python3 scripts/release.py publish

  update-site:
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Update release and download pages, then rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 scripts/release_site.py publish
