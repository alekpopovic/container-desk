name: Native checks and unsigned packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.target }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          rustup show active-toolchain
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
          if [ "$(uname -s)" = Darwin ]; then
            sw_vers
            xcode-select -p
            xcrun --show-sdk-version
          fi
      - name: Linux system prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64 file qemu-system-x86 qemu-utils seabios genisoimage
      - name: Install locked dependencies
        run: npm run verify:install -- --report test-results/install.json
      - name: Chromium system prerequisites
        if: runner.os == 'Linux'
        run: npm exec playwright -- install-deps chromium
      - name: Packaging failure boundaries
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Required checks and ordinary production build
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee test-results/verification.log
      - name: Package checked ordinary build
        id: package
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: python3 scripts/package_ci.py
      - name: Native macOS package acceptance
        if: runner.os == 'macOS'
        run: python3 tests/lab/macos_package_smoke.py
      - name: Native encrypted-agent SSH and Docker matrix
        run: python3 scripts/native_matrix.py
      - name: Retain unsigned packages and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: containerdesk-${{ steps.package.outputs.version }}-${{ matrix.target }}-${{ github.sha }}
          path: dist-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain reports on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  macos-desktop-probe:
    name: Desktop access probe (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect existing native desktop access
        run: |
          mkdir -p test-results
          swiftc tests/lab/macos_desktop_probe.swift -o "$RUNNER_TEMP/desktop-probe"
          swiftc tests/lab/macos_package_ui.swift -o "$RUNNER_TEMP/package-ui"
          "$RUNNER_TEMP/desktop-probe" > test-results/desktop-probe.json
          cat test-results/desktop-probe.json
      - name: Verify disposable Mac VM and encrypted agent prerequisites
        run: python3 scripts/native_matrix.py --provision-only
      - name: Retain desktop probe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-probe-${{ matrix.runner }}-${{ github.run_id }}
          path: test-results/
          retention-days: 14
